version: '3.8'

services:
  message-center:
    build: .
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - MAX_MESSAGES=100
      # Uncomment and set your Pushbullet API key to enable Pushbullet notifications
      # - PUSHBULLET_API_KEY=your_api_key_here
    volumes:
      # Uncomment to mount a custom .env file
      # - ./.env:/app/.env
      - ./templates:/app/templates
    restart: unless-stopped
    networks:
      - message-center-network

networks:
  message-center-network:
    driver: bridge
