<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Center Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js" 
            integrity="sha384-7EyYLQZgWBi67fBtVxw60/OWl1kjsfrPFcaU0pp0nAh+i8FD068QogUvg85Ewy1k" 
            crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .messages-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .messages-header {
            padding: 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-header h2 {
            color: #333;
        }

        .clear-btn {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .clear-btn:hover {
            background: #dc2626;
        }

        .messages-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .message {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message:last-child {
            border-bottom: none;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .message-source {
            font-weight: bold;
            color: #667eea;
        }

        .message-time {
            color: #666;
            font-size: 0.85rem;
        }

        .message-priority {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .priority-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .priority-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .priority-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message-content {
            color: #333;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-metadata {
            margin-top: 10px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 5px;
            font-size: 0.85rem;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .connection-lost {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📬 Message Center</h1>
            <div class="status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Connected</span>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="messageCount">0</div>
                <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="recentCount">0</div>
                <div class="stat-label">Last Minute</div>
            </div>
        </div>

        <div id="connectionLost" class="connection-lost" style="display: none;">
            ⚠️ Connection lost. Attempting to reconnect...
        </div>

        <div class="messages-container">
            <div class="messages-header">
                <h2>Recent Messages</h2>
                <button class="clear-btn" onclick="clearMessages()">Clear Display</button>
            </div>
            <div class="messages-list" id="messagesList">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <p>No messages yet. Waiting for incoming messages...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let allMessages = [];
        let recentMessages = [];

        // Socket connection handlers
        socket.on('connect', () => {
            console.log('Connected to server');
            updateConnectionStatus(true);
            socket.emit('request_messages');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            updateConnectionStatus(false);
        });

        socket.on('connection_status', (data) => {
            console.log('Connection status:', data);
        });

        socket.on('all_messages', (data) => {
            allMessages = data.messages || [];
            renderMessages();
            updateStats();
        });

        socket.on('new_message', (message) => {
            allMessages.unshift(message);
            if (allMessages.length > 100) {
                allMessages = allMessages.slice(0, 100);
            }
            addMessageToDOM(message);
            updateStats();
            
            // Track recent messages (last minute)
            recentMessages.push(Date.now());
            setTimeout(() => {
                recentMessages.shift();
                updateStats();
            }, 60000);
        });

        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const connectionLost = document.getElementById('connectionLost');
            
            if (connected) {
                indicator.style.background = '#10b981';
                statusText.textContent = 'Connected';
                connectionLost.style.display = 'none';
            } else {
                indicator.style.background = '#ef4444';
                statusText.textContent = 'Disconnected';
                connectionLost.style.display = 'block';
            }
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        function createMessageElement(message) {
            const priorityClass = `priority-${message.priority || 'info'}`;
            
            let metadataHTML = '';
            if (message.metadata && Object.keys(message.metadata).length > 0) {
                metadataHTML = `
                    <div class="message-metadata">
                        <strong>Metadata:</strong> ${JSON.stringify(message.metadata, null, 2)}
                    </div>
                `;
            }

            return `
                <div class="message">
                    <div class="message-header">
                        <div>
                            <span class="message-source">${escapeHtml(message.source || 'Unknown')}</span>
                            <span class="message-priority ${priorityClass}">${message.priority || 'info'}</span>
                        </div>
                        <span class="message-time">${formatTimestamp(message.timestamp)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(message.message)}</div>
                    ${metadataHTML}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessageToDOM(message) {
            const messagesList = document.getElementById('messagesList');
            const emptyState = messagesList.querySelector('.empty-state');
            
            if (emptyState) {
                emptyState.remove();
            }
            
            const messageElement = document.createElement('div');
            messageElement.innerHTML = createMessageElement(message);
            messagesList.insertBefore(messageElement.firstElementChild, messagesList.firstChild);
        }

        function renderMessages() {
            const messagesList = document.getElementById('messagesList');
            
            if (allMessages.length === 0) {
                messagesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No messages yet. Waiting for incoming messages...</p>
                    </div>
                `;
                return;
            }
            
            messagesList.innerHTML = allMessages.map(createMessageElement).join('');
        }

        function updateStats() {
            document.getElementById('messageCount').textContent = allMessages.length;
            document.getElementById('recentCount').textContent = recentMessages.length;
        }

        function clearMessages() {
            allMessages = [];
            recentMessages = [];
            renderMessages();
            updateStats();
        }

        // Initial load
        fetch('/api/messages')
            .then(response => response.json())
            .then(data => {
                allMessages = data.messages || [];
                renderMessages();
                updateStats();
            })
            .catch(error => console.error('Error loading messages:', error));
    </script>
</body>
</html>
